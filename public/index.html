<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Ponto · Grupo Shalom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="/css/style.css"/>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="lbox">
    <div class="lhead">
      <div class="logo"><i class="ti ti-clock-hour-9"></i></div>
      <h1>Registro de Ponto</h1>
      <p>Grupo Shalom · selecione a loja</p>
    </div>
    <div class="lbody">
      <div>
        <label class="fl">Loja</label>
        <select id="lg-loja" class="inp"></select>
      </div>
      <div>
        <label class="fl">Senha de acesso</label>
        <input id="lg-senha" class="inp" type="password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
      </div>
      <div id="lg-err" class="badge bd-rd hide" style="width:100%;justify-content:center"></div>
      <button class="btn p full" onclick="doLogin()"><i class="ti ti-login-2"></i> Entrar</button>
    </div>
    <div class="lfoot">Funcionários <b>0000</b> (só registro) · Gerente <b>1234</b> (acesso total)</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hide">
  <div class="topbar">
    <div class="tb-logo"><i class="ti ti-clock-hour-9"></i></div>
    <div>
      <div class="tb-name" id="tb-loja">—</div>
      <div class="tb-sub" id="tb-role">—</div>
    </div>
    <div class="tb-clock">
      <div class="t mono" id="tb-time">--:--</div>
      <div class="d" id="tb-date">—</div>
    </div>
    <button class="iconbtn" title="Sair" onclick="doLogout()"><i class="ti ti-logout-2"></i></button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="page" id="page"></div>
</div>

<!-- ===================== PUNCH FULLSCREEN ===================== -->
<div id="punch-screen" class="hide">
  <div class="pk-top">
    <button class="btn sm" id="pk-back" onclick="exitPunch()"><i class="ti ti-arrow-left"></i> Voltar</button>
    <div style="font-weight:700" id="pk-loja"></div>
    <div class="pk-clock">
      <div class="t mono" id="pk-time">--:--:--</div>
      <div class="d" id="pk-date"></div>
    </div>
  </div>
  <div class="pk-grid" id="pk-grid"></div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast"><i class="ti ti-check"></i><span></span></div>

<script src="/js/app.js"></script>
</body>
</html>
